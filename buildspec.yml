# ---------------------------------------------------------------------------
# AWS CodeBuild buildspec for the Terraform hub-and-spoke network (Training1)
# ---------------------------------------------------------------------------
# CodeBuild authenticates with its IAM *service role*, so no long-lived AWS
# keys are needed here or in the build project's environment.
#
# One-time setup (see ci/ and README "CI/CD Pipelines"):
#   1. CodeBuild project created from ci/codebuild-project.json - source =
#      CodeCommit repo `privatevpc-task` (branch `master`), this buildspec, the
#      `privatevpc-task-codebuild-role` service role (ci/*.json policies).
#      Authenticates with that role, so no long-lived AWS keys are needed here
#      or in the build project's environment.
#   2. Artifacts (the two .tfplan files) go to `privatevpc-task-artifacts-...`.
#   3. Set TF_APPLY=true in the project's environment variables to let builds
#      apply (hub first, then the spoke). Left unset/false the build is
#      plan-only, and the spoke plan is skipped until the hub state exists.
# ---------------------------------------------------------------------------
version: 0.2

env:
  variables:
    TF_VERSION: "1.15.8"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    # TF_APPLY is deliberately NOT set here. A value in this section would
    # override the build project's variable, so the project (or
    # `start-build --environment-variables-override`) owns the toggle and the
    # build phase falls back to "false" when it is unset.

phases:
  install:
    commands:
      - bash scripts/install-terraform.sh
  pre_build:
    commands:
      - terraform version
      - terraform fmt -check -recursive Training1
      - |
        # Always produced, so the artifacts phase has at least one matching file
        # even when a stack could not be planned (and therefore wrote no .tfplan).
        {
          echo "commit: ${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}"
          echo "build: ${CODEBUILD_BUILD_ID:-unknown}"
          terraform version 2>/dev/null | head -n 2
        } > ci-build-info.txt
      - ( cd Training1/Perimeter && terraform init -input=false -lock-timeout=5m )
      - ( cd Training1/DevOps && terraform init -input=false -lock-timeout=5m )
  build:
    commands:
      - ( cd Training1/Perimeter && terraform validate && terraform plan -input=false -lock-timeout=5m -out=perimeter.tfplan )
      # The spoke reads the Transit Gateway id out of the hub's S3 state, so it
      # can only be planned once the hub has been applied. The state location is
      # derived from the hub backend config (single source of truth) and checked
      # before planning, so a first plan-only build is not a red build.
      - |
        STATE_BUCKET=$(sed -n 's/.*bucket[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Training1/Perimeter/backend.tf | head -n 1)
        STATE_KEY=$(sed -n 's/.*key[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Training1/Perimeter/backend.tf | head -n 1)
        echo "Hub state: s3://${STATE_BUCKET}/${STATE_KEY}"
        if aws s3api head-object --bucket "${STATE_BUCKET}" --key "${STATE_KEY}" >/dev/null 2>&1; then
          ( cd Training1/DevOps && terraform validate \
              && terraform plan -input=false -lock-timeout=5m -out=devops.tfplan )
        else
          echo "Hub state object not found - skipping the DevOps (spoke) plan."
          echo "The spoke attaches to the Transit Gateway owned by the hub, so the"
          echo "hub has to be applied first: queue this build with TF_APPLY=true."
        fi
      # Apply is opt-in: the hub must exist before the spoke can read its TGW id.
      - |
        if [ "${TF_APPLY:-false}" = "true" ]; then
          echo "TF_APPLY=true - applying the hub, then the spoke"
          ( cd Training1/Perimeter && terraform apply -input=false -lock-timeout=5m -auto-approve perimeter.tfplan )
          if [ -f Training1/DevOps/devops.tfplan ]; then
            ( cd Training1/DevOps && terraform apply -input=false -lock-timeout=5m -auto-approve devops.tfplan )
          else
            # Hub state did not exist when the plan steps ran, so plan the spoke
            # now that the hub is applied and apply it in the same build.
            ( cd Training1/DevOps && terraform init -input=false -lock-timeout=5m \
                && terraform plan -input=false -lock-timeout=5m -out=devops.tfplan \
                && terraform apply -input=false -lock-timeout=5m -auto-approve devops.tfplan )
          fi
        else
          echo "TF_APPLY=${TF_APPLY:-false} - plan-only build, nothing applied"
        fi

artifacts:
  name: terraform-plans
  files:
    - ci-build-info.txt
    - Training1/Perimeter/perimeter.tfplan
    - Training1/DevOps/devops.tfplan
